name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Linkora Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Web Application
        working-directory: ./frontend
        run: npm run build

      - name: Make Gradle Executable
        run: chmod +x frontend/android/gradlew

      - name: Sync Android with Capacitor
        working-directory: ./frontend
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Artifact
        run: |
          mkdir -p output
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk output/Linkora-app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linkora-Android-APK
          path: output/Linkora-app-debug.apk
          retention-days: 30
